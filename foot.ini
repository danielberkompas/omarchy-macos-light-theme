# macOS Light terminal palette: high-contrast on a light background.
# "Black" is dark and "white" is a readable gray, so programs that assume
# a dark terminal still show all their text.
[colors-dark]
foreground=1d1d1f
background=fdf6f9
selection-foreground=000000
selection-background=f7cfe1
cursor=fdf6f9 1d1d1f

regular0=1d1d1f
regular1=c4001a
regular2=1a7431
regular3=8a5100
regular4=0040dd
regular5=8030a0
regular6=006584
regular7=6e6e73

bright0=5e5e63
bright1=d70015
bright2=1c7a33
bright3=9a5b00
bright4=0060df
bright5=9a3fc0
bright6=0073a0
bright7=000000
