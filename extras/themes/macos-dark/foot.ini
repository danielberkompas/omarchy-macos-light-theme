# macOS Dark terminal palette. "Black" is a visible dark gray and dim text
# (comments) uses Apple's secondary label gray, so everything stays readable.
[colors-dark]
foreground=e5e5e7
background=1e1e1e
selection-foreground=ffffff
selection-background=3f638b
cursor=1e1e1e e5e5e7

regular0=48484a
regular1=ff453a
regular2=32d74b
regular3=ffd60a
regular4=0a84ff
regular5=bf5af2
regular6=64d2ff
regular7=c7c7cc

bright0=98989d
bright1=ff6961
bright2=5de37a
bright3=ffe45c
bright4=409cff
bright5=da8fff
bright6=8adcff
bright7=ffffff
