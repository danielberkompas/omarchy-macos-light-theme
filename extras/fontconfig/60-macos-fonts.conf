<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  macOS-style fonts.
  Apple's SF fonts may only be used on Apple hardware, so this uses the closest
  free equivalents: Inter (variable version, which switches between Text and Display designs by size just like SF Pro) for SF Pro (the system UI font) and DejaVu Sans Mono
  (the font Apple's Menlo was built from) for SF Mono / Menlo.
-->
<fontconfig>
  <!-- The Omarchy bar and menus (quickshell) draw with "monospace". Give them
       Inter, like the macOS menu bar, while terminals keep the monospace font.
       The Nerd Fonts stay in the list so bar icons still render. -->
  <match target="pattern">
    <test name="prgname"><string>quickshell</string></test>
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="assign_replace" binding="strong">
      <string>Inter Variable</string>
      <string>DejaVuSansM Nerd Font</string>
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- Default sans-serif, system-ui and -apple-system are Inter.
       Omarchy's 50-omarchy.conf (which runs before user rules) turns these
       generic names into "Liberation Sans"; catch that when it is the first
       family requested and put Inter ahead of it. Explicit Arial requests keep
       their metric-compatible Liberation Sans. -->
  <match target="pattern">
    <test name="family" qual="first"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter Variable</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter Variable</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>-apple-system</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter Variable</string></edit>
  </match>

  <!-- Websites and documents that ask for Apple's fonts get the closest match. -->
  <alias binding="same"><family>SF Pro</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="same"><family>San Francisco</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="same"><family>Lucida Grande</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Monaco</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
